name: Daily Sync & Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CLIPROXY_SYNC }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save workflow file
        run: |
          cp .github/workflows/sync-and-release.yml /tmp/sync-and-release.yml

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Get latest upstream tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags --sort=-v:refname upstream 'v*' | head -1 | sed 's|.*refs/tags/||')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main into sync
        run: |
          git merge upstream/main -m "chore: sync with upstream/main" -X theirs 2>&1 || {
            echo "Merge had conflicts. Resolving modify/delete conflicts..."
            for file in $(git ls-files -u | awk '{print $4}' | sort -u); do
              if git checkout --theirs -- "$file" 2>/dev/null; then
                echo "  -> $file: upstream deleted, keeping upstream version"
                git add -- "$file"
              else
                echo "  -> $file: deleted by us, keeping deletion"
                git rm -- "$file" 2>/dev/null || git rm --cached -- "$file"
              fi
            done
            remaining=$(git ls-files -u | awk '{print $4}' | sort -u)
            if [ -n "$remaining" ]; then
              echo "ERROR: Still have unmerged files after resolution:"
              echo "$remaining"
              exit 1
            fi
          }
          if git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
            git diff HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD -- "$f"
              git add -- "$f"
            done
            git commit -m "chore: sync with upstream/main"
          else
            git diff HEAD^1..HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD^1 -- "$f"
              git add -- "$f"
            done
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi

      - name: Restore upstream files
        run: |
          # Restore config.go and parse.go from pre-merge (preserves fork's
          # kiro/copilot/z.ai fields and avoids CredentialConcurrency references).
          git checkout HEAD^1 -- internal/config/config.go internal/config/parse.go 2>/dev/null || true
          # Checkout openai_openai_request.go from upstream (has correct fmt import)
          git checkout upstream/main -- internal/translator/openai/openai/chat-completions/openai_openai_request.go 2>/dev/null || true
          # Delete all refactored config_*.go files — their types/functions
          # are already in our restored config.go (from pre-merge).
          for f in internal/config/config_*.go; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "config.go" ]; then
              git rm "$f" 2>/dev/null || true
            fi
          done
          [ -f internal/runtime/executor/helps/payload_helpers_upstream.go ] && git rm internal/runtime/executor/helps/payload_helpers_upstream.go 2>/dev/null || true
          git add -A 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore fork config after merge"
          fi

      - name: Restore sync-and-release workflow
        run: |
          cp /tmp/sync-and-release.yml .github/workflows/sync-and-release.yml
          git add .github/workflows/sync-and-release.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore sync-and-release workflow"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false

      - name: Sync go.sum after merge
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "fix: sync go.mod and go.sum after upstream merge"
          fi

      - name: Verify build
        run: |
          echo "Verifying build compiles before creating release tag..."
          phase=0
          for i in 1 2 3 4 5; do
            if output=$(go build -o /dev/null ./cmd/server/... 2>&1); then
              exit 0
            fi
            echo "$output"
            fixed=0
            if [ "$phase" = "0" ]; then
              # Checkout: try upstream for all error files (fixes imports, signatures, etc.)
              files=$(echo "$output" | grep -E "^[a-z].*\.go:" | grep -v "internal/config/config\.go:" | cut -d: -f1 | sort -u) || true
              for f in $files; do
                echo "  -> Checking out $f from upstream"
                git checkout upstream/main -- "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
                fixed=1
              done
              phase=1
            else
              # Delete: for undefined errors that checkout didn't fix
              if echo "$output" | grep -q "undefined:"; then
                files=$(echo "$output" | grep "undefined:" | cut -d: -f1 | sort -u)
                for f in $files; do
                  if [ "$f" != "internal/config/config.go" ]; then
                    echo "  -> Deleting $f (references undefined type)"
                    git rm "$f" 2>/dev/null || rm -f "$f"
                    fixed=1
                  fi
                done
              fi
              # Also handle non-undefined errors that weren't fixed by checkout
              files=$(echo "$output" | grep -E "^[a-z].*\.go:" | grep -v "undefined:" | grep -v "internal/config/config\.go:" | cut -d: -f1 | sort -u) || true
              if [ -n "$files" ]; then
                for f in $files; do
                  echo "  -> Checking out $f from upstream (other error)"
                  git checkout upstream/main -- "$f" 2>/dev/null || true
                  git add "$f" 2>/dev/null || true
                  fixed=1
                done
              fi
              phase=0
            fi
            if [ "$fixed" = "0" ]; then
              echo "Unfixable build errors — failing."
              exit 1
            fi
            if ! git diff --cached --quiet; then
              git commit -m "fix: resolve build errors after merge"
            fi
          done
          # Final build attempt
          go build -o /dev/null ./cmd/server/...

      - name: Check for changes to push
        id: check
        run: |
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin sync --force

      - name: Create release tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git tag -f "${{ steps.upstream.outputs.tag }}" HEAD
          git push origin "${{ steps.upstream.outputs.tag }}" --force

      - name: Summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "### Sync & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream tag: \`${{ steps.upstream.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: Merged upstream/main into branch \`sync\`" >> "$GITHUB_STEP_SUMMARY"
