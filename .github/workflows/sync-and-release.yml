name: Daily Sync & Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CLIPROXY_SYNC }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save workflow file
        run: |
          cp .github/workflows/sync-and-release.yml /tmp/sync-and-release.yml

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Get latest upstream tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags --sort=-v:refname upstream 'v*' | head -1 | sed 's|.*refs/tags/||')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main into sync
        run: |
          # Merge upstream/main into the current sync branch.
          # -X theirs prefers upstream changes for text conflicts, ensuring the
          # merged codebase stays self-consistent and compiles. Fork-specific
          # changes in non-conflicting hunks are still preserved.
          git merge upstream/main -m "chore: sync with upstream/main" -X theirs 2>&1 || {
            echo "Merge had conflicts. Resolving modify/delete conflicts..."
            for file in $(git ls-files -u | awk '{print $4}' | sort -u); do
              if git checkout --theirs -- "$file" 2>/dev/null; then
                echo "  -> $file: upstream deleted, keeping upstream version"
                git add -- "$file"
              else
                # --theirs failed, meaning we deleted this file — accept our deletion
                echo "  -> $file: deleted by us, keeping deletion"
                git rm -- "$file" 2>/dev/null || git rm --cached -- "$file"
              fi
            done
            # Verify nothing left unmerged
            remaining=$(git ls-files -u | awk '{print $4}' | sort -u)
            if [ -n "$remaining" ]; then
              echo "ERROR: Still have unmerged files after resolution:"
              echo "$remaining"
              exit 1
            fi
          }

          # Restore fork-specific files that upstream deleted but our fork depends on.
          # When upstream deletes a file we haven't modified, git silently accepts the
          # deletion without any conflict. These files need to be restored from HEAD.
          if git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
            # Still in merge state (had conflicts, not yet committed)
            git diff HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD -- "$f"
              git add -- "$f"
            done
            git commit -m "chore: sync with upstream/main"
          else
            # Merge was clean and already auto-committed as a merge commit.
            # HEAD^1 is the first parent (our sync branch before the merge).
            git diff HEAD^1..HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD^1 -- "$f"
              git add -- "$f"
            done
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi

      - name: Restore sync-and-release workflow
        run: |
          mkdir -p .github/workflows
          cp /tmp/sync-and-release.yml .github/workflows/sync-and-release.yml
          git add .github/workflows/sync-and-release.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore sync-and-release workflow"
          fi

      - name: Resolve upstream files
        run: |
          # client.go has diverged badly between fork and upstream.
          # Neither -X ours nor -X theirs produces a clean result here.
          # Take the authoritative upstream version.
          git checkout upstream/main -- internal/home/client.go
          git add internal/home/client.go
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore upstream client.go after merge"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false

      - name: Sync go.sum after merge
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "fix: sync go.mod and go.sum after upstream merge"
          fi

      - name: Verify build
        run: |
          echo "Verifying build compiles before creating release tag..."
          for i in 1 2 3; do
            if output=$(go build -o /dev/null ./cmd/server/... 2>&1); then
              exit 0
            fi
            echo "$output"
            fixed=0
            # Handle 'already declared' — checkout the file from upstream
            files=$(echo "$output" | grep "already declared" | cut -d: -f1 | sort -u) || true
            for f in $files; do
              echo "  -> Checking out $f from upstream (duplicate declarations)"
              git checkout upstream/main -- "$f"
              git add "$f"
              fixed=1
            done
            # Handle 'undefined' — checkout all upstream files with the symbol
            symbols=$(echo "$output" | grep "undefined:" | grep -o "undefined: [^ ]*" | sed 's/undefined: //' | sort -u) || true
            for sym in $symbols; do
              files=$(git grep -l "$sym" upstream/main -- '*.go') || true
              for sf in $files; do
                fpath="${sf#upstream/main:}"
                echo "  -> Checking out $fpath from upstream (contains $sym)"
                git checkout upstream/main -- "$fpath"
                git add "$fpath"
                fixed=1
              done
            done
            if [ "$fixed" = "0" ]; then
              echo "Unfixable build errors — failing."
              exit 1
            fi
            if ! git diff --cached --quiet; then
              git commit -m "fix: resolve build errors after merge"
            fi
          done
          # Final attempt — fail if still broken
          go build -o /dev/null ./cmd/server/...

      - name: Check for changes to push
        id: check
        run: |
          # Always allow release/tag creation if we are running the workflow
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin sync --force

      - name: Create release tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git tag -f "${{ steps.upstream.outputs.tag }}" HEAD
          git push origin "${{ steps.upstream.outputs.tag }}" --force

      - name: Summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "### Sync & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream tag: \`${{ steps.upstream.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: Merged upstream/main into branch \`sync\`" >> "$GITHUB_STEP_SUMMARY"
