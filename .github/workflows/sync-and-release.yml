name: Daily Sync & Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CLIPROXY_SYNC }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save workflow file
        run: |
          cp .github/workflows/sync-and-release.yml /tmp/sync-and-release.yml

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Get latest upstream tag
        id: upstream
        run: |
          TAG=$(git ls-remote --tags --sort=-v:refname upstream 'v*' | head -1 | sed 's|.*refs/tags/||')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/main into sync
        run: |
          git merge upstream/main -m "chore: sync with upstream/main" -X theirs 2>&1 || {
            echo "Merge had conflicts. Resolving modify/delete conflicts..."
            for file in $(git ls-files -u | awk '{print $4}' | sort -u); do
              if git checkout --theirs -- "$file" 2>/dev/null; then
                echo "  -> $file: upstream deleted, keeping upstream version"
                git add -- "$file"
              else
                echo "  -> $file: deleted by us, keeping deletion"
                git rm -- "$file" 2>/dev/null || git rm --cached -- "$file"
              fi
            done
            remaining=$(git ls-files -u | awk '{print $4}' | sort -u)
            if [ -n "$remaining" ]; then
              echo "ERROR: Still have unmerged files after resolution:"
              echo "$remaining"
              exit 1
            fi
          }
          if git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
            git diff HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD -- "$f"
              git add -- "$f"
            done
            git commit -m "chore: sync with upstream/main"
          else
            git diff HEAD^1..HEAD --diff-filter=D --name-only | while IFS= read -r f || [ -n "$f" ]; do
              echo "  -> Restoring fork-specific file: $f"
              git checkout HEAD^1 -- "$f"
              git add -- "$f"
            done
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi

      - name: Restore upstream files
        run: |
          # Restore config.go and parse.go from pre-merge (preserves fork's
          # kiro/copilot/z.ai fields and avoids CredentialConcurrency references).
          git checkout HEAD^1 -- internal/config/config.go internal/config/parse.go 2>/dev/null || true
          # Checkout files from upstream that need their upstream versions
          # (fixes imports, variable declarations, function signatures).
          for f in \
            internal/redisqueue/plugin.go \
            internal/api/middleware/response_writer.go \
            internal/translator/openai/openai/chat-completions/openai_openai_request.go; do
            git checkout upstream/main -- "$f" 2>/dev/null || true
          done
          # Checkout types.go from upstream (bypasses gitignore via git show)
          git show upstream/main:sdk/cliproxy/executor/types.go > sdk/cliproxy/executor/types.go 2>/dev/null || true
          git add -f sdk/cliproxy/executor/types.go 2>/dev/null || true
          # Delete config_*.go (redeclared) and codex_live.go (missing types)
          for f in internal/config/config_*.go internal/config/codex_live.go internal/config/codex_live_test.go; do
            [ -f "$f" ] && git rm "$f" 2>/dev/null || true
          done
          # Restore auth directory from pre-merge (preserves fork's kiro/auth features)
          git checkout HEAD^1 -- sdk/cliproxy/auth/ 2>/dev/null || true
          git add -f sdk/cliproxy/auth/ 2>/dev/null || true
          # Delete new upstream auth files that git checkout couldn't remove (gitignore)
          for f in sdk/cliproxy/auth/conductor_*.go sdk/cliproxy/auth/home_*.go; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "conductor.go" ]; then
              git rm -f "$f" 2>/dev/null || true
            fi
          done
          [ -f internal/client/codex/optimize-multi-agent-v2/optimize_multi_agent_v2.go ] && git rm internal/client/codex/optimize-multi-agent-v2/optimize_multi_agent_v2.go 2>/dev/null || true
          [ -f internal/runtime/executor/helps/payload_helpers_upstream.go ] && git rm internal/runtime/executor/helps/payload_helpers_upstream.go 2>/dev/null || true
          # Restore watcher/diff and sdk/api/handlers from pre-merge (avoids
          # references to new upstream auth/config features the fork doesn't have).
          git checkout HEAD^1 -- internal/watcher/diff/ sdk/api/handlers/ 2>/dev/null || true
          # Delete new upstream files that reference deleted auth types
          [ -f internal/store/postgres_cooldown_store.go ] && git rm internal/store/postgres_cooldown_store.go 2>/dev/null || true
          git add -A 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore fork config after merge"
          fi

      - name: Restore sync-and-release workflow
        run: |
          cp /tmp/sync-and-release.yml .github/workflows/sync-and-release.yml
          git add .github/workflows/sync-and-release.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: restore sync-and-release workflow"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: false

      - name: Sync go.sum after merge
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git add go.mod go.sum
            git commit -m "fix: sync go.mod and go.sum after upstream merge"
          fi

      - name: Verify build
        run: |
          echo "Verifying build compiles before creating release tag..."
          for i in 1 2 3 4 5; do
            if output=$(go build -o /dev/null ./cmd/server/... 2>&1); then
              exit 0
            fi
            echo "$output"
            fixed=0
            # Checkout all error files from upstream (fixes imports, signatures, etc.)
            files=$(echo "$output" | grep -E "^[a-z].*\.go:" | grep -v "internal/config/config\.go:" | cut -d: -f1 | sort -u) || true
            for f in $files; do
              echo "  -> Checking out $f from upstream"
              # git checkout doesn't update index for gitignored paths (sdk/cliproxy/)
              if echo "$f" | grep -q "^sdk/cliproxy/"; then
                git show upstream/main:"$f" > "$f" 2>/dev/null && git add -f "$f" 2>/dev/null || true
              else
                git checkout upstream/main -- "$f" 2>/dev/null || true
                git add "$f" 2>/dev/null || true
              fi
              fixed=1
            done
            if [ "$fixed" = "0" ]; then
              echo "Unfixable build errors — failing."
              exit 1
            fi
            if ! git diff --cached --quiet; then
              git commit -m "fix: resolve build errors after merge"
            fi
          done
          # Final build attempt
          go build -o /dev/null ./cmd/server/...

      - name: Check for changes to push
        id: check
        run: |
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: git push origin sync --force

      - name: Create release tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git tag -f "${{ steps.upstream.outputs.tag }}" HEAD
          git push origin "${{ steps.upstream.outputs.tag }}" --force

      - name: Summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "### Sync & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream tag: \`${{ steps.upstream.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: Merged upstream/main into branch \`sync\`" >> "$GITHUB_STEP_SUMMARY"
