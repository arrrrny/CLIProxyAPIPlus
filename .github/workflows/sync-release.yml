name: sync-release

# Replaces the removed sync-and-release.yml. Builds release binaries for
# linux/amd64 and darwin/amd64 (Intel Mac) on every push to the `sync` branch
# and publishes them as a GitHub **prerelease**.
#
# These are CI smoke-builds, not product releases: the tag-driven
# release.yaml workflow is the only path that publishes a real version, and it
# is the one clients must see as "latest". Publishing this as a prerelease
# keeps it out of the latest-release pointer, otherwise every push to `sync`
# would shadow the real tagged release for clients that poll
# /releases/latest or releases.atom.
#
# To ship a version: merge to `sync`, then push an annotated tag (for example
# `git tag -a v7.5.9 -m "chore(release): v7.5.9"` and `git push origin v7.5.9`).
# release.yaml derives the version from the tag name.

on:
  push:
    branches:
      - sync

permissions:
  contents: write

env:
  GO_VERSION: "1.26.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15
            goos: darwin
            goarch: amd64
            asset_arch: amd64
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_arch: amd64
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="sync-$(git rev-parse --short HEAD)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/archive
          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o dist/archive/cli-proxy-api ./cmd/server/
          cp LICENSE README.md config.example.yaml dist/archive/
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.tar.gz"
          tar -C dist/archive -czf "dist/$archive_name" cli-proxy-api LICENSE README.md config.example.yaml
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="sync-$(git rev-parse --short HEAD)"
          # --prerelease keeps this build out of the latest-release pointer so it
          # cannot shadow the real tagged release that clients poll for.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "CLIProxyAPI sync build $(git rev-parse --short HEAD)" \
            --prerelease \
            --notes "Automated CI smoke-build from the \`sync\` branch (linux/amd64 + darwin/amd64). Not a product release. Product versions are published by release.yaml from a pushed tag."
          gh release upload "$TAG" dist/CLIProxyAPI_*.tar.gz --clobber
